# 프론트엔드(정적 빌드 + nginx). 백엔드/DB는 agent-24-hackathon-backend 쪽에서 띄운다.
#   docker compose up -d --build
#
# agent24_network 는 백엔드의 docker-compose.db.yml 이 만든다. 없으면 먼저:
#   cd ../agent-24-hackathon-backend && docker compose -f docker-compose.db.yml up -d

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 상대경로로 고정한다. 절대 URL을 넣으면 CORS를 타고, 배포 도메인이 바뀔 때마다
        # 재빌드해야 한다. 백엔드 주소는 아래 BACKEND_ORIGIN에서 런타임에 결정된다.
        VITE_API_BASE_URL: /api/v1
    image: agent24/frontend:latest
    container_name: agent24-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-18087}:80"
    environment:
      BACKEND_ORIGIN: "${BACKEND_ORIGIN:-http://agent24_api:8000}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - agent24_network

networks:
  agent24_network:
    name: agent24_network
    external: true
