<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RAW API STREAM · AGENT:24</title>
  <style>
    :root{--bg:#080d10;--panel:#10181e;--line:#25313a;--fg:#e7eef2;--dim:#8797a3;--terra:#a58cf0;--luna:#79a8d8;--sol:#5ec1c6;--liner:#ef8967;--code:#96a2ac;--ok:#65c59e;--bad:#ed7464;--mono:ui-monospace,"Cascadia Mono",Consolas,monospace}
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--fg);font:12px/1.55 var(--mono);display:flex;flex-direction:column}
    header{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--line);background:#080d10f2;position:sticky;top:0;z-index:2}
    h1{margin:0;font-size:13px;letter-spacing:.16em}.proof{color:var(--ok);border:1px solid #315c4d;padding:3px 7px}.stat{color:var(--dim)}.stat b{color:var(--fg)}#conn{margin-left:auto}
    .filters{display:flex;align-items:center;gap:12px;padding:8px 18px;border-bottom:1px solid var(--line);background:var(--panel)}label{color:var(--dim)}input{accent-color:var(--liner)}
    .lanes{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--line)}.lane{padding:8px 12px;border-right:1px solid var(--line);color:var(--dim)}.lane:last-child{border:0}.lane b{display:block;color:var(--agent);font-size:11px}.lane.hot{background:#172128}
    main{flex:1;overflow:auto;padding:10px 18px 60px}.empty{text-align:center;color:var(--dim);padding:70px 10px}
    .event{--agent:var(--code);border-left:2px solid var(--agent);padding:5px 0 5px 11px;margin:2px 0}.event.tool{background:#161b1e;border-left-width:4px}.event.delta pre{max-height:2em;overflow:hidden;color:#667681}
    .head{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.seq{color:#5f6d77;min-width:42px;text-align:right}.tag{font-size:9px;color:var(--agent);border:1px solid color-mix(in srgb,var(--agent) 45%,transparent);padding:0 5px}.name{color:#afbbc3}.kind{color:#ffd0bf;font-weight:700}
    pre{white-space:pre-wrap;word-break:break-word;margin:4px 0 0;color:#aebbc4;font:11px/1.5 var(--mono);max-height:22em;overflow:auto}
    .terra{--agent:var(--terra)}.luna{--agent:var(--luna)}.sol{--agent:var(--sol)}.liner{--agent:var(--liner)}.code{--agent:var(--code)}
  </style>
</head>
<body>
  <header>
    <h1>RAW API STREAM</h1><span class="proof">OPENAI SDK · UNMODIFIED PAYLOAD</span>
    <span class="stat">RUN <b id="run">waiting</b></span><span class="stat">EVENTS <b id="count">0</b></span><span class="stat">TOOL CALLS <b id="calls">0</b></span><span class="stat">TOOL RESULTS <b id="results">0</b></span>
    <span class="stat" id="conn">연결 대기</span>
  </header>
  <div class="filters">
    <label><input id="toolsOnly" type="checkbox"> tool_call / tool_result만 보기</label>
    <label><input id="hideDelta" type="checkbox" checked> 토큰 delta 접기</label>
    <span class="stat">표시 필터만 적용되며 수신 payload는 수정하지 않습니다.</span>
  </div>
  <div class="lanes">
    <div class="lane terra" data-lane="terra"><b>TERRA</b><span>계획 · 최종 판정</span></div>
    <div class="lane luna" data-lane="luna"><b>LUNA</b><span>초안 · 대질 대응</span></div>
    <div class="lane sol" data-lane="sol"><b>SOL</b><span>검증 · 반론</span></div>
    <div class="lane liner" data-lane="liner"><b>LINER</b><span>검색 · 시각화 도구</span></div>
    <div class="lane code" data-lane="code"><b>CODE</b><span>집계 · 조립</span></div>
  </div>
  <main id="log"><div class="empty">메인 화면에서 START BRIEFING을 누르면 원본 API 이벤트가 여기에 표시됩니다.</div></main>
  <script>
    const params=new URLSearchParams(location.search);
    let apiBase=params.get("api")||location.origin+"/api/v1";
    let runId=params.get("run");
    let lastSeq=-1,total=0,calls=0,results=0,controller=null;
    const log=document.getElementById("log");
    const toolPattern=/tool_call|tool_called|tool_output|tool_result/i;
    const resultPattern=/tool_output|tool_result/i;
    const deltaPattern=/raw_response_event/i;
    const laneFor=(name)=>{
      if(toolPattern.test(name)&&/liner|search|visual|research/i.test(name))return"liner";
      if(/^01_|^06_/.test(name))return"terra";
      if(/^02_|^04_|^03a_/.test(name))return"luna";
      if(/^03_|^03b_|^03c_/.test(name))return"sol";
      if(/^05_|^01b_/.test(name))return"liner";
      return"code";
    };
    function applyFilters(){
      const toolsOnly=document.getElementById("toolsOnly").checked;
      const hideDelta=document.getElementById("hideDelta").checked;
      document.querySelectorAll(".event").forEach(el=>{el.hidden=(toolsOnly&&!el.classList.contains("tool"))||(hideDelta&&el.classList.contains("delta"));});
    }
    function render(seq,name,payload){
      const lane=laneFor(name),isTool=toolPattern.test(name),isResult=resultPattern.test(name),isDelta=deltaPattern.test(name)&&payload?.delta!==undefined;
      total++;if(isTool&&!isResult)calls++;if(isResult)results++;
      document.getElementById("count").textContent=total;document.getElementById("calls").textContent=calls;document.getElementById("results").textContent=results;
      document.querySelectorAll(".lane").forEach(el=>el.classList.toggle("hot",el.dataset.lane===lane));
      const el=document.createElement("article");el.className="event "+lane+(isTool?" tool":"")+(isDelta?" delta":"");
      const head=document.createElement("div");head.className="head";
      const seqEl=document.createElement("span");seqEl.className="seq";seqEl.textContent=String(seq).padStart(4,"0");
      const tag=document.createElement("span");tag.className="tag";tag.textContent=lane.toUpperCase();
      const nameEl=document.createElement("span");nameEl.className="name";nameEl.textContent=name;
      head.append(seqEl,tag,nameEl);
      if(isTool){const kind=document.createElement("span");kind.className="kind";kind.textContent=isResult?"TOOL RESULT":"TOOL CALL";head.append(kind);}
      const pre=document.createElement("pre");pre.textContent=JSON.stringify(payload,null,2);
      el.append(head,pre);if(log.querySelector(".empty"))log.textContent="";log.append(el);
      while(log.children.length>2500)log.firstElementChild.remove();
      applyFilters();log.scrollTop=log.scrollHeight;
    }
    async function stream(id){
      controller?.abort();controller=new AbortController();runId=id;lastSeq=-1;total=calls=results=0;log.innerHTML="";
      document.getElementById("run").textContent=id;document.getElementById("conn").textContent="● LIVE";document.getElementById("conn").style.color="var(--ok)";
      const response=await fetch(apiBase+"/runs/"+id+"/events",{headers:{Accept:"text/event-stream"},signal:controller.signal});
      if(!response.ok||!response.body)throw new Error("SSE HTTP "+response.status);
      const reader=response.body.getReader(),decoder=new TextDecoder();let buffer="";
      while(true){
        const chunk=await reader.read();if(chunk.done)break;buffer+=decoder.decode(chunk.value,{stream:true});
        const frames=buffer.split("\n\n");buffer=frames.pop()||"";
        for(const frame of frames){
          if(!frame.trim()||frame.startsWith(":"))continue;
          const seq=Number(frame.match(/^id:\s*(.+)$/m)?.[1]);const name=frame.match(/^event:\s*(.+)$/m)?.[1]||"event";const raw=frame.match(/^data:\s*(.*)$/m)?.[1]||"{}";
          if(!Number.isFinite(seq)||seq<=lastSeq)continue;lastSeq=seq;
          let payload;try{payload=JSON.parse(raw)}catch{payload={raw:raw}};
          render(seq,name,payload);
          if(name==="run_completed"||name==="run_failed"){document.getElementById("conn").textContent=name==="run_completed"?"● COMPLETE":"● FAILED";document.getElementById("conn").style.color=name==="run_completed"?"var(--ok)":"var(--bad)";}
        }
      }
    }
    document.getElementById("toolsOnly").addEventListener("change",applyFilters);document.getElementById("hideDelta").addEventListener("change",applyFilters);
    addEventListener("message",event=>{if(event.origin!==location.origin||event.data?.type!=="agent24-run")return;if(event.data.apiBase)apiBase=event.data.apiBase;history.replaceState(null,"","?run="+encodeURIComponent(event.data.runId)+"&api="+encodeURIComponent(apiBase));stream(event.data.runId).catch(showError);});
    function showError(error){if(error?.name==="AbortError")return;document.getElementById("conn").textContent="연결 실패: "+error.message;document.getElementById("conn").style.color="var(--bad)";}
    if(runId)stream(runId).catch(showError);
  </script>
</body>
</html>
